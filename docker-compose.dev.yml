services:
  frontend:
    container_name: jobifai-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Named volume prevents the host's (empty) node_modules from shadowing
      # the container's installed packages — critical for macOS Docker Desktop.
      - frontend_node_modules:/app/node_modules
    stdin_open: true
    tty: true

volumes:
  frontend_node_modules:
