# =============================================================================
# nginx/nginx.prod.conf — Production Reverse Proxy for JobifAI
# =============================================================================
#
# Traffic flow:
#
#   Internet ──HTTPS──► Nginx :443 ──► /api/*  → backend:8000 (FastAPI)
#                                   ──► /*      → frontend:80  (React SPA)
#
# WHY nginx handles SSL instead of the app containers:
#   • Single TLS termination point — backend and frontend stay simple HTTP
#   • Let's Encrypt cert management lives in one place
#   • SSL session caching, HSTS, and cipher negotiation in one config
#
# CRITICAL: SSE (Server-Sent Events) for the AI interview stream requires:
#   proxy_buffering off  — prevents nginx from buffering the stream
#   proxy_http_version 1.1  — SSE requires persistent HTTP/1.1 connections
#   proxy_set_header Connection ''  — removes the "close" header that would
#                                      terminate the long-lived connection
# =============================================================================

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen      80;
    listen      [::]:80;
    server_name cv.wealthifai.xyz;

    # Let's Encrypt ACME challenge (certbot places files here during renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else → permanent HTTPS redirect
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS server ──────────────────────────────────────────────────────────────
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name cv.wealthifai.xyz;

    # ── TLS configuration ──────────────────────────────────────────────────
    # Certificates are provisioned by the certbot service and mounted at:
    #   docker volume: ./nginx/certbot/conf → /etc/letsencrypt
    ssl_certificate     /etc/letsencrypt/live/cv.wealthifai.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cv.wealthifai.xyz/privkey.pem;

    # Strong modern cipher suite (Mozilla "Intermediate" profile, 2024)
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;

    # HSTS: once a browser visits over HTTPS it will always use HTTPS.
    # max-age=63072000 = 2 years.  Only add after confirming HTTPS works.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── Request size limits ────────────────────────────────────────────────
    # The resume upload endpoint accepts PDFs up to ~5 MB.
    client_max_body_size 10M;

    # ── SSE endpoint: AI interview stream ─────────────────────────────────
    # MUST disable buffering — every token must reach the browser immediately.
    # This endpoint produces a long-lived HTTP/1.1 connection with chunked
    # transfer; buffering would hold all tokens until the response finishes.
    location /api/chat/interview {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE CRITICAL settings
        proxy_http_version 1.1;
        proxy_set_header   Connection '';
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;   # 5-minute max for a single interview turn
    }

    # ── Stripe webhook: raw body preservation ─────────────────────────────
    # Stripe HMAC verification requires the exact raw bytes of the payload.
    # We set a shorter timeout (webhook events are small and fast).
    location /api/webhooks/stripe {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 15s;
    }

    # ── All other API routes → FastAPI backend ─────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    # ── Frontend SPA (React) ───────────────────────────────────────────────
    # All non-/api/ paths go to the frontend container.
    # The frontend nginx handles the SPA fallback (all routes → index.html).
    location / {
        proxy_pass         http://frontend:80;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;

        # Static asset caching — Vite hashes filenames so we can cache forever
        location ~* \.(js|css|woff2?|png|jpg|webp|svg|ico|webm)$ {
            proxy_pass       http://frontend:80;
            add_header       Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
