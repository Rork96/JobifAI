# =============================================================================
# nginx/nginx.cloudflare.conf — HTTP reverse proxy for Cloudflare Tunnel
# =============================================================================
#
# Traffic flow (Cloudflare Tunnel active):
#
#   Browser ──HTTPS──► Cloudflare Edge (TLS terminated here)
#                           │
#                       Encrypted tunnel
#                           │
#                    Pi host :80 (loopback)
#                           │
#                    ┌──────▼──────┐
#                    │    nginx    │  (this config)
#                    │    :80      │
#                    └──┬──────┬──┘
#                       │      │
#              /api/*   │      │  /*
#                       ▼      ▼
#              backend:8000  frontend:80
#              (FastAPI)     (React SPA)
#
# WHY no TLS here:
#   Cloudflare Tunnel encrypts the link between the Pi and Cloudflare's edge.
#   Cloudflare terminates HTTPS for the user.  Inside the Pi's Docker network
#   everything is plain HTTP — safe because it never leaves the machine.
#
# SSE NOTE (AI interview stream):
#   proxy_buffering off is CRITICAL for Server-Sent Events.  Without it nginx
#   batches tokens until the buffer fills, making the chat appear to freeze.
# =============================================================================

server {
    listen      80;
    listen      [::]:80;
    server_name _;   # Accept any Host header — CF Tunnel rewrites it

    # ── Security headers ──────────────────────────────────────────────────
    # HSTS is handled by Cloudflare (edge policy) — don't set it here.
    add_header X-Frame-Options         "SAMEORIGIN"                     always;
    add_header X-Content-Type-Options  "nosniff"                        always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # ── Real IP from Cloudflare ───────────────────────────────────────────
    # Cloudflare sets CF-Connecting-IP to the visitor's real IP.
    # We forward it so FastAPI logs show actual IPs, not Cloudflare IPs.
    set_real_ip_from  173.245.48.0/20;
    set_real_ip_from  103.21.244.0/22;
    set_real_ip_from  103.22.200.0/22;
    set_real_ip_from  103.31.4.0/22;
    set_real_ip_from  141.101.64.0/18;
    set_real_ip_from  108.162.192.0/18;
    set_real_ip_from  190.93.240.0/20;
    set_real_ip_from  188.114.96.0/20;
    set_real_ip_from  197.234.240.0/22;
    set_real_ip_from  198.41.128.0/17;
    set_real_ip_from  162.158.0.0/15;
    set_real_ip_from  104.16.0.0/13;
    set_real_ip_from  104.24.0.0/14;
    set_real_ip_from  172.64.0.0/13;
    set_real_ip_from  131.0.72.0/22;
    real_ip_header    CF-Connecting-IP;

    # ── Request size limits ───────────────────────────────────────────────
    client_max_body_size 10M;   # PDF uploads up to ~5 MB

    # ── SSE endpoint: AI interview stream ─────────────────────────────────
    # MUST have: proxy_buffering off + proxy_http_version 1.1 + Connection ''
    location /api/chat/interview {
        proxy_pass          http://backend:8000;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto https;   # Always HTTPS from user's POV
        proxy_http_version  1.1;
        proxy_set_header    Connection        '';
        proxy_buffering     off;
        proxy_cache         off;
        proxy_read_timeout  300s;   # 5-minute max for one AI interview turn
    }

    # ── Stripe webhook: must preserve raw body ─────────────────────────────
    location /api/webhooks/stripe {
        proxy_pass          http://backend:8000;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto https;
        proxy_http_version  1.1;
        proxy_read_timeout  15s;
    }

    # ── All other API routes → FastAPI backend ─────────────────────────────
    location /api/ {
        proxy_pass          http://backend:8000;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto https;
        proxy_http_version  1.1;
        proxy_read_timeout  60s;
    }

    # ── React SPA (everything else) ────────────────────────────────────────
    location / {
        proxy_pass          http://frontend:80;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-Proto https;
        proxy_http_version  1.1;
        proxy_read_timeout  30s;

        # Hashed Vite assets can be cached forever (filename changes on rebuild)
        location ~* \.(js|css|woff2?|png|jpg|webp|svg|ico|webm)$ {
            proxy_pass       http://frontend:80;
            add_header       Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
