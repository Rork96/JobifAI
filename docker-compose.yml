# ──────────────────────────────────────────────────────────────────────────────
# JobifAI — Docker Compose (development + production on Raspberry Pi 5)
#
# Usage:
#   Development (hot-reload):  docker compose -f docker-compose.dev.yml up --build
#   Production (daemon):       docker compose -f docker-compose.yml up -d
#
# Architecture overview:
#   ┌──────────────────────────────────────────────────────┐
#   │  Local Mac M3 / Raspberry Pi 5                       │
#   │                                                      │
#   │  ┌──────────────┐     ┌──────────────────────────┐  │
#   │  │  frontend    │     │  backend (FastAPI)        │  │
#   │  │  Vite:5173   │────▶│  uvicorn:8000             │  │
#   │  └──────────────┘     └──────────┬───────────────┘  │
#   │                                  │                   │
#   │                          ┌───────▼────────┐          │
#   │                          │  Supabase      │          │
#   │                          │  (hosted cloud)│          │
#   │                          └────────────────┘          │
#   └──────────────────────────────────────────────────────┘
# ──────────────────────────────────────────────────────────────────────────────

services:
  # ── FastAPI Backend ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend   # Docker build context — only backend/ is sent
      dockerfile: Dockerfile
      # Force ARM64 so images built on an x86 dev machine still run on the Pi.
      # If you build *on* the Pi directly, this is a no-op.
      platforms:
        - linux/arm64

    image: jobifai-backend:latest
    container_name: jobifai-backend
    restart: unless-stopped   # Auto-restart on crash; stop manually with `docker stop`

    # ── Port mapping ─────────────────────────────────────────────────────────
    ports:
      - "8000:8000"

    # ── Environment variables ─────────────────────────────────────────────────
    env_file:
      - ./backend/.env

    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}

    # ── Volumes ───────────────────────────────────────────────────────────────
    volumes:
      - ./backend:/app/backend   # live-reload dev mount

    # ── Health check (Compose-level) ─────────────────────────────────────────
    healthcheck:
      test: ["CMD", "python", "-c",
             "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s   # Give uvicorn time to boot before first check

    # ── Resource limits ───────────────────────────────────────────────────────
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

    # ── Logging ───────────────────────────────────────────────────────────────
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── React Frontend (Vite Dev Server) ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    
    image: jobifai-frontend:dev
    container_name: jobifai-frontend
    restart: unless-stopped

    # ── Port mapping ─────────────────────────────────────────────────────────
    ports:
      - "5173:5173"

    # ── Environment variables ─────────────────────────────────────────────────
    environment:
      # Explicitly tell Vite where the backend lives inside the Docker network
      - VITE_API_URL=http://backend:8000

    # ── Volumes ───────────────────────────────────────────────────────────────
    volumes:
      # Live-reload mount: macOS host -> Container
      - ./frontend:/app
      # Critical: Protect container's node_modules from being overwritten by macOS
      - /app/node_modules

    # ── Startup Order ─────────────────────────────────────────────────────────
    # Ensure Vite only boots after FastAPI is fully ready to accept connections
    depends_on:
      backend:
        condition: service_healthy

    # ── Resource limits ───────────────────────────────────────────────────────
    # Vite and Vite's HMR can be memory-hungry during development.
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"